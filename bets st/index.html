<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadium Bets - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2 class="login-title">Bienvenido a Stadium Bets</h2>
            <p class="login-subtitle">Ingresa tu nombre para comenzar</p>
            <div class="login-field">
                <input type="text" id="loginNombre" placeholder="Tu nombre" autocomplete="given-name">
            </div>
            <div class="login-field">
                <input type="text" id="loginApellido" placeholder="Tu apellido" autocomplete="family-name">
            </div>
            <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
            <p class="login-hint" id="loginHint"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="funciones/login.js"></script>
</body>
</html>
