<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stadium Bets - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="images/icono.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <div class="login-banner">
                <img src="images/banner.png" alt="Stadium Bets">
            </div>
            <p class="login-subtitle">Ingresa tus datos para comenzar</p>
            <div class="login-field">
                <input type="text" id="loginNombre" placeholder="Tu nombre completo" autocomplete="name">
            </div>
            <div class="login-field">
                <input type="email" id="loginCorreo" placeholder="Tu correo electrónico" autocomplete="email">
            </div>
            <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
            <p class="login-hint" id="loginHint"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
        document.addEventListener('dblclick', function(e) { e.preventDefault(); });
    </script>
    <script src="funciones/verificacion.js"></script>
    <script src="funciones/sesion.js"></script>
    <script src="funciones/login.js"></script>
</body>
</html>
