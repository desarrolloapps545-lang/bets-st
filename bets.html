<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadium Bets - Apuestas en Vivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">Stadium Bets</h1>
                <p class="app-subtitle">Apuestas Disponibles</p>
            </div>
            <div class="header-right">
                <span class="welcome-msg" id="welcome"></span>
                <span class="clock" id="clock"></span>
                <button class="btn btn-logout" id="btnLogout">Salir</button>
            </div>
        </header>

        <div class="cards-container" id="cards">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando apuestas...</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 class="modal-title" id="modal-title">Realizar Apuesta</h2>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Cargando...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="funciones/bets.js"></script>
</body>
</html>
